{% extends "base.html" %}

{% block title %}
Create Account | Guardian SHIELD
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <!-- HEADER -->
        <div class="auth-header">

            <div class="auth-icon">
                S
            </div>

            <div class="eyebrow">
                GET STARTED
            </div>

            <h1>Create your account.</h1>

            <p>
                Set up your Guardian SHIELD safety profile.
            </p>

        </div>


        <!-- ERROR MESSAGE -->
        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}


        <!-- REGISTER FORM -->
        <form method="POST" class="auth-form">

            {% csrf_token %}

            <!-- FULL NAME -->
            <div class="form-group">

                <label for="full_name">
                    Full name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    value="{{ request.POST.full_name }}"
                    required
                    autocomplete="name"
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    value="{{ request.POST.email }}"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group">

                <label for="confirm_password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                class="auth-submit"
            >
                Create Account
            </button>

        </form>


        <!-- LOGIN LINK -->
        <div class="auth-footer">

            <span>
                Already have an account?
            </span>

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
