{% extends "base.html" %}

{% block title %}
Login | Guardian SHIELD
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                S
            </div>

            <div class="eyebrow">
                WELCOME BACK
            </div>

            <h1>
                Sign in to Guardian SHIELD.
            </h1>

            <p>
                Access your personal safety dashboard.
            </p>

        </div>


        {% if error %}

            <div class="form-error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" class="auth-form">

            {% csrf_token %}


            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    value="{{ request.POST.email }}"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            <span>
                Don't have an account?
            </span>

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>

    </div>

</section>

{% endblock %}
